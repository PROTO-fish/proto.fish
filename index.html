<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTO/fish</title>
    <meta name="description" content="PROTO/fish builds small, focused, open-source apps. First up: SlashFacts, a multiplication-facts trainer." />
    <meta property="og:title" content="PROTO/fish" />
    <meta property="og:description" content="Small, focused, open-source apps." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:image" content="https://proto.fish/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 400 900;
        font-stretch: 62% 125%;
        font-display: swap;
        src: url('fonts/archivo-latin.woff2') format('woff2');
      }
      :root { --ink: #000; --paper: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #fff; --paper: #000; }
      }
      * { box-sizing: border-box; margin: 0; }
      html { background: var(--paper); color: var(--ink); }
      body {
        font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; }
      header {
        border-bottom: 4px solid var(--ink);
        padding-bottom: 12px;
      }
      .mark {
        font-size: clamp(2.25rem, 13vw, 8rem);
        font-weight: 900;
        font-stretch: 112%;
        letter-spacing: -0.03em;
        line-height: 0.9;
      }
      .lede {
        font-size: clamp(1.25rem, 3.5vw, 1.75rem);
        font-weight: 800;
        line-height: 1.2;
        margin: 32px 0 48px;
        max-width: 32ch;
      }
      h2 {
        font-size: 0.875rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .project {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 20px;
        align-items: center;
        border: 4px solid var(--ink);
        padding: 20px;
        text-decoration: none;
      }
      .project:hover, .project:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
      .project:hover img, .project:focus-visible img { filter: invert(1); }
      .project img { width: 88px; height: 88px; display: block; }
      @media (prefers-color-scheme: dark) {
        .project img { filter: invert(1); }
        .project:hover img, .project:focus-visible img { filter: none; }
      }
      .project h3 {
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 900;
        font-stretch: 108%;
        line-height: 1;
      }
      .project p { font-weight: 600; margin-top: 8px; line-height: 1.35; }
      .links { margin-top: 12px; font-weight: 800; display: flex; flex-wrap: wrap; gap: 8px 20px; }
      footer {
        margin-top: auto;
        padding-top: 48px;
        font-weight: 700;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
      }
      @media (max-width: 480px) {
        .project { grid-template-columns: minmax(0, 1fr); }
        .project img { width: 64px; height: 64px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="mark">PROTO/fish</h1>
    </header>

    <main>
      <p class="lede">Small, focused apps. Black and white, offline, open source.</p>

      <h2>Projects</h2>
      <a class="project" href="https://slashfacts.proto.fish">
        <img src="slashfacts.png" alt="" />
        <div>
          <h3>/ FACTS</h3>
          <p>Multiplication tables 2–9, answered with a single stroke. Know it or don't — six seconds to spit it out.</p>
          <div class="links"><span>Play on the web →</span></div>
        </div>
      </a>
    </main>

    <footer>
      <span>© PROTO/fish</span>
      <a href="https://github.com/PROTO-fish">GitHub</a>
    </footer>
  </body>
</html>
